name: Update profile cards

on:
  schedule:
    # Every day at 03:00 KST (18:00 UTC)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate GitHub activity cards
        id: activity_cards
        continue-on-error: true
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          mkdir -p \
            profile-summary-card-output/github \
            profile-summary-card-output/github_dark

          base_url="https://github-profile-summary-cards.vercel.app/api/cards"
          temp_dir="${RUNNER_TEMP}/profile-summary-card-output"

          mkdir -p \
            "${temp_dir}/github" \
            "${temp_dir}/github_dark"

          download_card() {
            local endpoint="$1"
            local theme="$2"
            local output="$3"
            local temp_output="${temp_dir}/${output}"

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --output "${temp_output}" \
              "${base_url}/${endpoint}?username=${USERNAME}&theme=${theme}"

            if [[ ! -s "${temp_output}" ]] || \
              ! grep -Eq '<svg([[:space:]>])' "${temp_output}" || \
              ! grep -q '</svg>' "${temp_output}"; then
              echo "Invalid SVG response for ${output}." >&2
              return 1
            fi
          }

          download_card stats github github/3-stats.svg
          download_card stats github_dark github_dark/3-stats.svg
          download_card most-commit-language github github/2-most-commit-language.svg
          download_card most-commit-language github_dark github_dark/2-most-commit-language.svg

          mv "${temp_dir}/github/3-stats.svg" profile-summary-card-output/github/3-stats.svg
          mv "${temp_dir}/github_dark/3-stats.svg" profile-summary-card-output/github_dark/3-stats.svg
          mv \
            "${temp_dir}/github/2-most-commit-language.svg" \
            profile-summary-card-output/github/2-most-commit-language.svg
          mv \
            "${temp_dir}/github_dark/2-most-commit-language.svg" \
            profile-summary-card-output/github_dark/2-most-commit-language.svg

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            profile-3d-contrib \
            profile-summary-card-output/github \
            profile-summary-card-output/github_dark

          if git diff --cached --quiet; then
            echo "No profile card changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile cards"
          git push

      - name: Report activity card generation failure
        if: always() && steps.activity_cards.outcome == 'failure'
        run: |
          echo "::error::GitHub activity cards could not be generated. Existing cards were preserved."
          {
            echo "### GitHub activity card generation failed"
            echo
            echo "The existing activity cards were preserved, and the 3D contribution graph was still generated."
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
