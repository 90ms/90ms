name: Update profile cards

on:
  schedule:
    # Every day at 03:00 KST (18:00 UTC)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate GitHub activity cards
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          mkdir -p \
            profile-summary-card-output/github \
            profile-summary-card-output/github_dark

          base_url="https://github-profile-summary-cards.vercel.app/api/cards"

          curl --fail --location --retry 3 \
            --output profile-summary-card-output/github/3-stats.svg \
            "${base_url}/stats?username=${USERNAME}&theme=github"
          curl --fail --location --retry 3 \
            --output profile-summary-card-output/github_dark/3-stats.svg \
            "${base_url}/stats?username=${USERNAME}&theme=github_dark"
          curl --fail --location --retry 3 \
            --output profile-summary-card-output/github/2-most-commit-language.svg \
            "${base_url}/most-commit-language?username=${USERNAME}&theme=github"
          curl --fail --location --retry 3 \
            --output profile-summary-card-output/github_dark/2-most-commit-language.svg \
            "${base_url}/most-commit-language?username=${USERNAME}&theme=github_dark"

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            profile-3d-contrib \
            profile-summary-card-output/github \
            profile-summary-card-output/github_dark

          if git diff --cached --quiet; then
            echo "No contribution graph changes to commit."
            exit 0
          fi

          git commit -m "chore: update 3D contribution graph"
          git push
